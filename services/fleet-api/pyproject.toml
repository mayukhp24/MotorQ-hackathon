[project]
name = "fleetpulse-api"
version = "1.0.0"
description = "FleetPulse Fleet API: secure, tenant-isolated REST/WebSocket API and maintenance copilot"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "asyncpg==0.30.0",
  "redis==5.2.1",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "PyJWT[crypto]==2.10.1",
  "bcrypt==4.2.1",
  "prometheus-client==0.21.1",
  "orjson==3.10.13",
  "python-multipart==0.0.20",
  "anthropic>=0.60",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-sdk==1.29.0",
  "opentelemetry-exporter-otlp-proto-http==1.29.0",
  "opentelemetry-instrumentation-fastapi==0.50b0",
]
test = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "pytest-cov==6.0.0",
  "fakeredis==2.26.2",
  "behave==1.2.6",
  "testcontainers[postgres,redis]==4.9.0",
  "schemathesis==3.39.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit", "tests/integration"]
markers = ["integration: needs Docker (Testcontainers)"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/main_otel.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
