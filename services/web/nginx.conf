# SPA + reverse proxy to the Fleet API (same origin: no CORS, cookies unused).
upstream fleet_api { server fleet-api:8000; keepalive 32; }
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 1m;

  # The API sets its own security headers; everything else gets these.
  location /api/ {
    proxy_pass http://fleet_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }
  location /.well-known/ { proxy_pass http://fleet_api; }
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
