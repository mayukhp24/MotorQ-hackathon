# MQTT broker for OEM connectors / edge gateways (dev). Production uses an
# EMQX cluster with mTLS client certificates (see docs/security.md).
persistence false
log_dest stdout
log_type error
log_type warning
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl
max_inflight_messages 1000
max_queued_messages 200000
max_packet_size 16777216
message_size_limit 16777216
