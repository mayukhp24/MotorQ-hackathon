# MQTT broker for OEM connectors / edge gateways (dev). Production uses an
# EMQX cluster with mTLS client certificates (see docs/security.md).
persistence false
log_dest stdout
log_type error
log_type warning
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl
max_inflight_messages 1000
max_queued_messages 200000
# Bound broker memory per offline/slow subscriber session (otherwise a stalled
# gateway lets the queue grow to many GB); beyond it QoS 1 messages are dropped
# and counted, and the HTTPS path's 429 back-pressure is the lossless option.
max_queued_bytes 536870912
# Drop sessions of clients that never come back (e.g. replaced containers).
persistent_client_expiration 1h
max_packet_size 16777216
message_size_limit 16777216
