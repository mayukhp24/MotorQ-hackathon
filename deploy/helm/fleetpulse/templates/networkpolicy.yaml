{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy -}}
# Zero-trust baseline: deny everything, then allow only the flows in the
# architecture diagram (ingress controller -> web/api/gateway, pods -> managed
# data services, fleet-api -> LLM API over 443, Prometheus -> metrics).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    {{- include "fp.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-data-services
  labels:
    {{- include "fp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        {{- range $np.dataServiceCIDRs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: 5432}   # PostgreSQL
        - {protocol: TCP, port: 6379}   # Redis
        - {protocol: TCP, port: 9092}   # Kafka
        - {protocol: TCP, port: 9094}   # Kafka TLS
        - {protocol: TCP, port: 9096}   # Kafka SASL/SCRAM
        - {protocol: TCP, port: 8443}   # ClickHouse HTTPS
        - {protocol: TCP, port: 8123}   # ClickHouse HTTP (in-VPC)
        - {protocol: TCP, port: 8883}   # MQTT over TLS
        - {protocol: TCP, port: 443}    # cloud APIs via VPC endpoints
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-controller
  labels:
    {{- include "fp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [web, fleet-api, ingest-gateway]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
      ports: [{port: 8080}, {port: 8000}]
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/component: web}}
      ports: [{port: 8000}]
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/component: simulator}}
      ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  labels:
    {{- include "fp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
      ports: [{port: 8000}, {port: 9101}, {port: 9102}, {port: 9103}, {port: 9104}, {port: 9105}]
{{- if $np.allowInternetEgressFor }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-https-egress
  labels:
    {{- include "fp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: {{ toJson $np.allowInternetEgressFor }}}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: ["169.254.169.254/32"]   # no instance-metadata access
      ports: [{protocol: TCP, port: 443}]
{{- end }}
{{- if .Values.simulator.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-simulator-to-gateway
  labels:
    {{- include "fp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: simulator}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/component: ingest-gateway}}
      ports: [{port: 8080}]
{{- end }}
{{- end }}
