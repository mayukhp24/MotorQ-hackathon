global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: ingest-gateway
    dns_sd_configs: [{names: [ingest-gateway], type: A, port: 9101}]
  - job_name: stream-processor      # every replica, discovered via DNS
    dns_sd_configs: [{names: [stream-processor], type: A, port: 9103}]
  - job_name: sink-writer
    dns_sd_configs: [{names: [sink-writer], type: A, port: 9104}]
  - job_name: simulator
    dns_sd_configs: [{names: [simulator], type: A, port: 9102}]
  - job_name: fleet-api
    metrics_path: /metrics
    dns_sd_configs: [{names: [fleet-api], type: A, port: 8000}]
  - job_name: analytics
    dns_sd_configs: [{names: [analytics], type: A, port: 9105}]
  - job_name: kafka
    static_configs: [{targets: ["kafka-exporter:9308"]}]
  - job_name: clickhouse
    static_configs: [{targets: ["clickhouse:9363"]}]
